name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Least-privilege default: every job only needs to read the repo. Set this at
# workflow scope so repo-level GITHUB_TOKEN defaults can't silently widen it.
permissions:
  contents: read

jobs:
  test:
    name: Component Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run component tests
        run: npm test

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript type check
        run: npx tsc --noEmit

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [test, typecheck]

    env:
      PAYLOAD_SECRET: e2e-ci-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [test, typecheck]

    env:
      PAYLOAD_SECRET: ci-build-secret
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

  migrate:
    name: Database Migrations
    runs-on: ubuntu-latest
    needs: [test, typecheck, e2e, build]
    # Only apply migrations once code has actually merged to master — never on
    # a PR, which would otherwise run pending migrations against production
    # before the corresponding code is even deployed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run pending migrations against production
        env:
          DATABASE_URI: ${{ secrets.DATABASE_URI }}
        run: |
          if [ -z "$DATABASE_URI" ]; then
            echo "::warning::DATABASE_URI secret is not set on this repo — skipping production migration. Add it under Settings > Secrets and variables > Actions to enable this step."
            exit 0
          fi
          npm run migrate
